plugins:
  - search:
      lang: [zh, en]
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - github-callouts          # 需 pip install markdown-callouts，兼容 > [!NOTE]
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tasklist: {custom_checkbox: true, clickable_checkbox: true}
  - toc: {permalink: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

site_author: tech-notes contributors
copyright: "© tech-notes contributors · 内容采用 CC BY 4.0<br>本站内容由 AI 生成，资料与资源链接来源于网络，仅供学习参考；如有错误或侵权，请提 Issue 告知。"
edit_uri: edit/main/
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: info   # 目录链接如 topics/ 无法静态校验
  anchors: warn
