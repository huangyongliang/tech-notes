# tech-notes 的 GitHub Pages 站点配置（MkDocs Material）
site_name: tech-notes 技术笔记
site_url: https://huangyongliang.github.io/tech-notes/
repo_url: https://github.com/huangyongliang/tech-notes
repo_name: tech-notes
# docs_dir 不能是 mkdocs.yml 所在目录：CI 先运行 scripts/prepare_site_src.sh 复制内容到 _site_src/ 再构建。
# LICENSE → GitHub 绝对链接；templates/ 不进站点（正文里只以行内代码提及）。
docs_dir: _site_src

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: 切换深色}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: 切换浅色}
  font: false            # 用系统字体，国内访问不卡（等宽字体走系统栈）
  icon: {repo: fontawesome/brands/github, logo: material/notebook-outline}
  features:
    - navigation.tabs        # 顶部按技术栈分栏
    - navigation.indexes     # 目录 README 作为分栏首页
    - navigation.top
    - navigation.footer      # 上一节 / 下一节
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
    - navigation.instant
    - navigation.tracking

extra_css:
  - stylesheets/extra.css
  - stylesheets/explore.css
  - stylesheets/chibi-sprites.css
  - stylesheets/game.css

# mode-boot.js 必须第一个（尽早给 <html> 加 tn-mode-game / tn-mode-read）；
# dialogs-loader.js 入库；dialogs-java.js / dialogs-basics.js 由 prepare_site_src.sh 构建期生成，不入库。
extra_javascript:
  - javascripts/mode-boot.js
  - javascripts/chibi-sprites.js
  - javascripts/quest-data.js
  - javascripts/dialogs-loader.js
  - javascripts/quest.js
  - javascripts/explore.js
  - javascripts/game.js

