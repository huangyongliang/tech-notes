# tech-notes 的 GitHub Pages 站点配置（MkDocs Material）
site_name: tech-notes 技术笔记
site_url: https://huangyongliang.github.io/tech-notes/
repo_url: https://github.com/huangyongliang/tech-notes
repo_name: tech-notes
# docs_dir 不能是 mkdocs.yml 所在目录：CI 先运行 scripts/prepare_site_src.sh 复制内容到 _site_src/ 再构建。
# LICENSE → GitHub 绝对链接；templates/ 不进站点（正文里只以行内代码提及）。
docs_dir: _site_src

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: 切换深色}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: 切换浅色}
  font: false            # 用系统字体，国内访问不卡
  icon: {repo: fontawesome/brands/github, logo: material/notebook-outline}
  features:
    - navigation.tabs        # 顶部按技术栈分栏
    - navigation.indexes     # 目录 README 作为分栏首页
    - navigation.top
    - navigation.footer      # 上一节 / 下一节
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
    - navigation.instant
    - navigation.tracking

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - Java:
      - topics/java/README.md
      - 01 语言基础与新特性: topics/java/01-language-basics/README.md
      - 02 集合框架: topics/java/02-collections/README.md
      - 03 异常、泛型、反射与注解: topics/java/03-core-advanced/README.md
      - 04 输入输出: topics/java/04-io-nio/README.md
      - 05 并发: topics/java/05-concurrency/README.md
      - 06 Java 虚拟机: topics/java/06-jvm/README.md
      - 07 构建工具: topics/java/07-build-tools/README.md
      - 08 测试: topics/java/08-testing/README.md
      - 09 Spring 框架: topics/java/09-spring/README.md
      - 10 持久层: topics/java/10-persistence/README.md
      - 11 性能与诊断: topics/java/11-performance-diagnostics/README.md
      - 12 生态与新趋势: topics/java/12-ecosystem-trends/README.md
  - 全部主题:
      - topics/README.md
      - 编程: topics/programming/README.md
      - Web: topics/web/README.md
      - 系统: topics/systems/README.md
      - DevOps: topics/devops/README.md
      - AI / ML: topics/ai-ml/README.md
      - 产品调研: topics/product-research/README.md
      - Inbox: topics/inbox/README.md
  - 笔记: notes/README.md
  - 资料:
      - resources/README.md
      - 链接表: resources/links.md
  - 关于:
      - 贡献指南: CONTRIBUTING.md
      - 展示规范: STYLE.md

plugins:
  - search:
      lang: [zh, en]
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - github-callouts          # 需 pip install markdown-callouts，兼容 > [!NOTE]
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

site_author: tech-notes contributors
copyright: "© tech-notes contributors · 内容采用 CC BY 4.0"
edit_uri: edit/main/
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: info   # 目录链接如 topics/ 无法静态校验
  anchors: warn
